version: 2

builds:
  - id: stalemark
    main: ./cmd/stalemark
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/jnvr1/stalemark/internal/cli.version={{.Version}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  groups:
    - title: Features
      regexp: '^feat'
    - title: Fixes
      regexp: '^fix'
    - title: Others
  filters:
    exclude: ["^docs", "^test", "^chore", "^ci"]

# ponytail: dockers_v2 is provisional in goreleaser v2 (replaces dockers in v3); it needs no per-arch images or manifests.
dockers_v2:
  - images: [ghcr.io/jnvr1/stalemark]
    tags: ["{{ .Version }}", latest]
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/jnvr1/stalemark
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
