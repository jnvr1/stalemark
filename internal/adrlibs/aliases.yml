# Curated aliases: what an ADR calls a technology -> the names its libraries
# go by in go.mod, package.json, pyproject.toml, Cargo.toml and requirements.txt.
# Keys are lowercase; values are matched against manifest names, lowercase.
postgres: [pg, psycopg, sqlx, github.com/lib/pq, postgres, psycopg2, psycopg2-binary, asyncpg, github.com/jackc/pgx, tokio-postgres, "@prisma/client"]
postgresql: [pg, psycopg, sqlx, github.com/lib/pq, postgres, psycopg2, psycopg2-binary, asyncpg, github.com/jackc/pgx, tokio-postgres, "@prisma/client"]
mysql: [mysql, mysql2, mysqlclient, pymysql, github.com/go-sql-driver/mysql, mysql-async, sqlx, "@prisma/client"]
sqlite: [sqlite3, better-sqlite3, aiosqlite, github.com/mattn/go-sqlite3, modernc.org/sqlite, rusqlite, sqlx]
redis: [redis, ioredis, github.com/redis/go-redis, redis-py]
mongodb: [mongodb, mongoose, pymongo, go.mongodb.org/mongo-driver]
mongo: [mongodb, mongoose, pymongo, go.mongodb.org/mongo-driver]
kafka: [kafkajs, confluent-kafka, github.com/segmentio/kafka-go, rdkafka]
rabbitmq: [amqplib, pika, github.com/rabbitmq/amqp091-go]
prisma: [prisma, "@prisma/client"]
react: [react]
vue: [vue]
angular: ["@angular/core"]
express: [express]
fastapi: [fastapi]
django: [django]
flask: [flask]
gin: [github.com/gin-gonic/gin]
echo: [github.com/labstack/echo]
cobra: [github.com/spf13/cobra]
tokio: [tokio]
serde: [serde]
axum: [axum]
actix: [actix-web]
tailwind: [tailwindcss]
typescript: [typescript]
jest: [jest]
vitest: [vitest]
pytest: [pytest]
