name: action

# ponytail: release/dispatch only, a PR run would fail by construction before the first release; add pull_request (paths: action.yml, scripts/**) once one exists.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release to install (without v), or latest
        default: latest
  release:
    types: [published]

permissions:
  contents: read

jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Clean fixture passes
        uses: ./
        with:
          version: ${{ inputs.version || 'latest' }}
          working-directory: testdata/e2e/clean
          format: text
      - name: Drifted fixture fails
        id: drifted
        uses: ./
        continue-on-error: true
        with:
          version: ${{ inputs.version || 'latest' }}
          working-directory: testdata/e2e/drifted
          format: text
      - name: Drifted fixture must have failed
        if: steps.drifted.outcome != 'failure'
        run: echo "expected the drifted fixture to fail, got ${{ steps.drifted.outcome }}" && exit 1

  checksum-mismatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build a fake release
        run: |
          mkdir "$RUNNER_TEMP/rel"
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/stalemark" ./cmd/stalemark
          tar -czf "$RUNNER_TEMP/rel/stalemark_0.0.0_linux_amd64.tar.gz" -C "$RUNNER_TEMP" stalemark
          echo "$(printf '0%.0s' {1..64})  stalemark_0.0.0_linux_amd64.tar.gz" > "$RUNNER_TEMP/rel/checksums.txt"
      - name: Wrong checksum aborts
        run: '! STALEMARK_BASE_URL="file://$RUNNER_TEMP/rel" VERSION=0.0.0 bash scripts/install.sh "$RUNNER_TEMP/bad"'
      - name: Correct checksum installs
        run: |
          (cd "$RUNNER_TEMP/rel" && sha256sum stalemark_0.0.0_linux_amd64.tar.gz > checksums.txt)
          bin=$(STALEMARK_BASE_URL="file://$RUNNER_TEMP/rel" VERSION=0.0.0 bash scripts/install.sh "$RUNNER_TEMP/good")
          test -x "$bin"
