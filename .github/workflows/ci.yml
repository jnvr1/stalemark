name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      # ponytail: fuzz once per run on the cheapest runner; the seed corpus runs everywhere via go test.
      - name: Fuzz markdown parser and shell extractor
        if: runner.os == 'Linux'
        run: make fuzz
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      # ponytail: windows-latest ships no GNU make; raw go steps above/below cover it there.
      - name: Exercise Makefile
        if: runner.os != 'Windows'
        run: make test lint build
      - name: Build without cgo
        run: go build ./cmd/stalemark
        env:
          CGO_ENABLED: "0"

  # Proves .pre-commit-hooks.yaml works end to end. pre-commit runs hooks from the git root of the
  # target, so each fixture becomes a throwaway git repo instead of a subdirectory of this one.
  pre-commit:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - run: pip install pre-commit
      - name: Clean fixture passes
        run: |
          cp -r testdata/e2e/clean "$RUNNER_TEMP/clean"
          cd "$RUNNER_TEMP/clean"
          git init -q && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm fixture
          pre-commit try-repo "$GITHUB_WORKSPACE" stalemark --all-files
      - name: Drifted fixture fails
        run: |
          cp -r testdata/e2e/drifted "$RUNNER_TEMP/drifted"
          cd "$RUNNER_TEMP/drifted"
          git init -q && git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -qm fixture
          ! pre-commit try-repo "$GITHUB_WORKSPACE" stalemark --all-files

  # The repo checks its own docs; a stale command or path fails CI. Fix the doc or baseline it with a reason,
  # never disable the rule.
  # ponytail: runs the freshly built binary; switch to `uses: ./` once the composite Action (#17) lands.
  dogfood:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make build
      - name: Check this repository
        run: ./bin/stalemark check --format github .
      - name: Drifted fixture must fail
        run: "! ./bin/stalemark check testdata/e2e/drifted"

  # External tools of the API docs wrappers (ADR 0003). The default jobs stay tool-free; here the real tool
  # must run (no skip) and its raw output must match the committed fixtures.
  tools:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v7
      - run: pip install "pydoclint==0.11.1"
      - name: Wrapper tests with the real tool
        run: |
          go test ./internal/pydoclint -run TestCheckWithTool -v | tee tools.log
          grep -q -e '--- PASS: TestCheckWithTool' tools.log
          ! grep -q SKIP tools.log
      - name: Raw output fixtures are current
        run: |
          make fixtures-pydoclint
          git diff --exit-code testdata/pydoclint
      # setup-go does not put GOPATH/bin on PATH.
      - run: |
          go install github.com/oasdiff/oasdiff@v1.33.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: oasdiff wrapper tests with the real tool
        run: |
          go test ./internal/oasdiff -run TestCheckWithTool -v | tee oasdiff.log
          grep -q -e '--- PASS: TestCheckWithTool' oasdiff.log
          ! grep -q SKIP oasdiff.log
      - name: oasdiff raw output fixtures are current
        run: |
          make fixtures-oasdiff
          git diff --exit-code testdata/oasdiff

  # Catches .goreleaser.yaml rot on every PR; docker and publish are skipped (no registry on the runner).
  snapshot:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=docker,publish
